name: Block media files

on:
  push:
  pull_request:

jobs:
  block-media-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if tracked media files exist
        run: |
          media_files=$(git ls-files -- '*.mp4' '*.mkv')
          if [ -n "$media_files" ]; then
            echo "Tracked media files are not allowed:"
            printf '%s
' "$media_files"
            exit 1
          fi
